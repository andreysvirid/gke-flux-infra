# values.yaml
image:
  repository: andreysvirid/kbot2
  tag: "v1.0.0-f34e424"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false

serviceAccount:
  create: false

autoscaling:
  enabled: false

env:
  - name: TELEGRAM_TOKEN
    valueFrom:
      secretKeyRef:
       name: "telegram-token"
       key: "token"

