apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kbot
  namespace: demo-helm
spec:
  interval: 1m
  chart:
    spec:
      chart: ./kbot
      sourceRef:
        kind: GitRepository
        name: kbot-repo  # теперь GitRepository в том же namespace
      version: "*"
  install:
    timeout: 5m
  upgrade:
    timeout: 5m
  values:
    env:
      - name: TELEGRAM_TOKEN
        valueFrom:
          secretKeyRef:
            name: telegram-token
            key: token